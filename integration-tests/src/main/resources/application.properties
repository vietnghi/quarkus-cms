quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:cms;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.cms.enabled=true
quarkus.cms.types-package=io.quarkiverse.cms.types
mp.openapi.filter=io.quarkiverse.cms.runtime.rest.PerTypeOpenApiFilter
smallrye.openapi.filter=io.quarkiverse.cms.runtime.rest.PerTypeOpenApiFilter
