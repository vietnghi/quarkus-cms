<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Quarkus CMS Admin</title>
<link rel="stylesheet" href="/cms-admin/style.css">
<script src="/cms-admin/htmx.js"></script>
</head>
<body>
<nav>
  <div style="padding:0 16px 16px;font-weight:700;font-size:18px;border-bottom:1px solid #333">Quarkus CMS</div>
  <h2>Content Types</h2>
  {#for type in types}
    <a href="/cms-admin/content/{type.pluralName}" class="{currentType is type.pluralName ? 'active' : ''}">{type.pluralName}</a>
  {/for}
  <h2>Admin</h2>
  <a href="/cms-admin/media">📁 Media Library</a>
  <a href="/cms-admin/roles">🔐 Roles & Policies</a>
  <div style="margin-top:20px;padding:12px 16px;border-top:1px solid #333">
    <span>🌐 en</span>
    <a href="/cms-admin/logout" class="btn btn-danger btn-sm">Logout</a>
  </div>
</nav>
<main>
  {#insert body}Default content{/}
</main>
</body>
</html>
